name: CI

on:
  push:
    branches: [main, fix/**]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-python:
    name: Validate Python Examples
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.12"]
        exclude:
          - os: macos-latest
            python-version: "3.9"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: pip install pytest pytest-cov requests

      - name: Syntax check all Python files
        run: |
          find python/ use-cases/ templates/python-project/ -name "*.py" | while read f; do
            echo "Checking $f"
            python -m py_compile "$f"
          done

      - name: Run validation tests
        run: python -m pytest tests/test_examples.py -v --tb=short

  validate-typescript:
    name: Validate TypeScript Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Type-check TypeScript examples
        run: npx tsc --noEmit

      - name: Lint check
        run: npx eslint .

  validate-shell:
    name: Validate Shell Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check shell syntax
        run: bash -n curl/quickstart.sh

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check for hardcoded secrets
        run: |
          if grep -rn 'vq_live_[a-zA-Z0-9]\{10,\}' python/ use-cases/ templates/ typescript/ curl/; then
            echo "ERROR: Found hardcoded live API keys!"
            exit 1
          fi
          echo "No hardcoded secrets found"

  live-tests:
    name: Live API Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [validate-python, validate-typescript]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest requests

      - name: Run live tests
        env:
          VECTRADE_API_KEY: ${{ secrets.VECTRADE_API_KEY }}
        run: python -m pytest tests/test_live.py -v --tb=short
